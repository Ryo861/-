name: Windows Phase A
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m tools.diagnose
      - run: python -m tools.ci_tests
      - run: python -m tools.build_windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: |
            dist/practice-record-checker-windows-portable.zip
            dist/practice-record-checker-windows-portable.sha256.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portable-validation
          path: build/portable-smoke/
          if-no-files-found: ignore
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-portable
          path: download
      - name: Publish validated portable ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" download/*.zip download/*.sha256.txt --title "介護実習記録チェッカー インストール不要版 $RELEASE_TAG" --notes "Windows 64bit向けフェーズA。ZIPをすべて展開し、PracticeRecordChecker.exeを起動してください。Pythonのインストールは不要です。Windows CIでテストとEXEによる画面・PDF保存を確認済み。学校のアプリ実行制限は別途確認が必要です。"
